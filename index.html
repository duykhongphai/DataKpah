<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataKpah — dữ liệu Khí Phách Anh Hùng</title>
  <meta name="description" content="Tra cứu trang bị, bình thuốc, ngọc, quái và kỹ năng Khí Phách Anh Hùng từ dữ liệu máy chủ.">
  <meta name="theme-color" content="#f0892b">
  <link rel="canonical" href="https://duykhongphai.github.io/DataKpah/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DataKpah — dữ liệu Khí Phách Anh Hùng">
  <meta property="og:description" content="Kho dữ liệu Khí Phách Anh Hùng cập nhật tự động từ máy chủ game.">
  <meta property="og:url" content="https://duykhongphai.github.io/DataKpah/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23f0892b' d='M16 2 28 7v8c0 7.8-5 12.3-12 15C9 27.3 4 22.8 4 15V7z'/%3E%3Cpath fill='%23151618' d='m16 7 2.3 4.7 5.2.8-3.8 3.7.9 5.2-4.6-2.5-4.6 2.5.9-5.2-3.8-3.7 5.2-.8z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#records">Bỏ qua điều hướng</a>

  <header class="site-header">
    <div class="brand-row shell">
      <a class="brand" href="#/equipment" aria-label="DataKpah — trang chủ">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M16 3 28 8v7c0 7.6-4.8 12-12 14.7C8.8 27 4 22.6 4 15V8z"/><path class="mark-star" d="m16 7 2.2 4.5 5 .7-3.6 3.5.8 5-4.4-2.4-4.4 2.4.8-5-3.6-3.5 5-.7z"/></svg>
        </span>
        <span><strong>DataKpah</strong><small>Dữ liệu Khí Phách Anh Hùng</small></span>
      </a>

      <div class="freshness" id="freshness" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span>Đang kiểm tra dữ liệu…</span>
      </div>

      <a class="header-link" href="https://github.com/duykhongphai/DataKpah" target="_blank" rel="noreferrer">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.88c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.64-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.55 9.55 0 0 1 12 6.81c.85 0 1.7.11 2.5.34 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.86v2.76c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
        Mã nguồn
      </a>
    </div>

    <div class="route-band">
      <div class="route-shell shell">
        <div class="route-current" aria-hidden="true">
          <span id="route-code">TB</span>
          <strong id="route-name">Trang bị</strong>
        </div>
        <nav class="routes" id="routes" aria-label="Danh mục dữ liệu"></nav>
      </div>
    </div>
  </header>

  <main class="shell page-shell">
    <section class="control-deck" aria-label="Tìm và sắp xếp dữ liệu">
      <div class="search-box">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.2 16.2 4 4"/></svg>
        <label class="sr-only" for="search">Tìm dữ liệu</label>
        <input id="search" type="search" autocomplete="off" placeholder="Tìm theo tên, mô tả hoặc ID…">
        <kbd>/</kbd>
      </div>

      <label class="sort-control">
        <span>Sắp xếp</span>
        <select id="sort">
          <option value="id-asc">ID tăng dần</option>
          <option value="id-desc">ID giảm dần</option>
          <option value="name-asc">Tên A → Z</option>
          <option value="name-desc">Tên Z → A</option>
        </select>
      </label>

      <a class="raw-link" id="raw-link" href="TeaMobi/DuLieu/EquipmentItems.json" target="_blank">
        JSON gốc
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </a>

      <div class="record-count" aria-live="polite"><strong id="record-count">0</strong><span>mục</span></div>
    </section>

    <section class="data-stage" id="records" tabindex="-1" aria-labelledby="stage-title">
      <div class="stage-heading">
        <div>
          <h1 id="stage-title">Trang bị</h1>
          <p id="stage-description">Mẫu trang bị và chỉ số cơ bản.</p>
        </div>
        <span class="result-note" id="result-note"></span>
      </div>

      <div class="records" id="record-grid" aria-live="polite" aria-busy="true">
        <div class="loading-row" aria-label="Đang tải dữ liệu">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
      <nav class="pagination" id="pagination" aria-label="Phân trang"></nav>
    </section>
  </main>

  <aside class="detail-panel" id="detail-panel" aria-labelledby="detail-title" aria-hidden="true" inert>
    <div class="detail-head">
      <div>
        <span class="detail-kind" id="detail-kind">Chi tiết</span>
        <h2 id="detail-title">Bản ghi</h2>
      </div>
      <button class="icon-button" id="detail-close" type="button" aria-label="Đóng chi tiết">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="detail-body" id="detail-body"></div>
    <div class="detail-actions">
      <button class="copy-button" id="copy-json" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        Chép JSON
      </button>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <div class="shell">
      <span>Dữ liệu lấy trực tiếp từ máy chủ game và cập nhật tự động mỗi ngày.</span>
      <a href="https://github.com/duykhongphai/DataKpah/actions" target="_blank" rel="noreferrer">Trạng thái cập nhật</a>
    </div>
  </footer>
</body>
</html>
